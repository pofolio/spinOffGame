<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>눈가리고 찰칵</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <a href="../../index.html" class="home-button">🏠</a>
            <h1>눈가리고 찰칵</h1>
        </header>

        <div class="game-content">
            <div class="game-description">
                <h2>게임 설명</h2>
                <div class="description-content">
                    <p>3:3 팀전으로 진행되는 눈가리고 찰칵 게임입니다.</p>
                    <p>사진 찍는 사람은 총 5장의 사진을 찍을 수 있습니다.</p>
                </div>

                <h2>게임 규칙</h2>
                <div class="score-rules">
                    <div class="rule-steps">
                        <p>1. 사진 찍는 사람은 의자에 앉아서 눈을 가린 채 카메라로 사진을 찍습니다.</p>
                        <p>2. 도망가는 팀은 카메라에 찍히지 않도록 앉은 채로 엉덩이만을 이용해 이동합니다.</p>
                        <p>3. 사진에 나온 사람을 카운트하여 가장 많이 찍은 팀이 승리합니다.</p>
                    </div>
                </div>

                <h2>보상</h2>
                <div class="rewards">
                    <p>승리 팀 개인: 3점</p>
                    <p>패배 팀 개인: 1점</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
