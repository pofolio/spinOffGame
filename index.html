<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레트로 게임 월드</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-console">
        <header class="console-header">
            <h1>🎮 레트로 게임 월드</h1>
        </header>
        
        <main class="game-container">
            <div class="game-list">
                <div class="game-card">
                    <h2>게임 1</h2>
                    <p>곧 출시 예정!</p>
                </div>
                <div class="game-card">
                    <h2>게임 2</h2>
                    <p>곧 출시 예정!</p>
                </div>
                <div class="game-card">
                    <h2>게임 3</h2>
                    <p>곧 출시 예정!</p>
                </div>
            </div>
        </main>

        <nav class="tab-menu">
            <button class="tab-button active" data-tab="home">🏠 홈</button>
            <button class="tab-button" data-tab="games">🎮 게임</button>
            <button class="tab-button" data-tab="about">ℹ️ 정보</button>
        </nav>
    </div>
    <script src="js/main.js"></script>

</html>
