<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스핀오프 게임 월드</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-console">
        <header class="console-header">
            <h1>🎮 스핀오프 게임 월드</h1>
        </header>
        
        <main class="game-container">
            <div class="tab-content active" id="home-content">
                <div class="welcome-message">
                    <h2>환영합니다!</h2>
                    <p>여러가지 스핀오프 게임을 즐겨보세요.</p>
                </div>
                <div class="game-list">
                    <div class="game-card">
                        <h2>팀 배정 게임</h2>
                        <p>파티장을 선택하고 팀을 만들어보세요!</p>
                        <a href="games/seatChange/index.html" class="play-button">게임 시작</a>
                    </div>
                    <div class="game-card">
                        <h2>컬링 게임</h2>
                        <p>3:3 팀전으로 진행되는 컬링 게임!</p>
                        <a href="games/curling/index.html" class="play-button">게임 시작</a>
                    </div>
                    <div class="game-card">
                        <h2>눈가리고 찰칵</h2>
                        <p>눈을 가린 채 사진을 찍어보세요!</p>
                        <a href="games/blindPhoto/index.html" class="play-button">게임 시작</a>
                    </div>
                    <div class="game-card">
                        <h2>릴레이 그리기</h2>
                        <p>주어진 단어를 릴레이로 그리는 게임입니다.</p>
                        <a href="games/relayDrawing/index.html" class="play-button">게임 시작</a>
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
