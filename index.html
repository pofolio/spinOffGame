<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레트로 게임 월드</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-console">
        <header class="console-header">
            <h1>🎮 레트로 게임 월드</h1>
        </header>
        
        <main class="game-container">
            <div class="tab-content active" id="home-content">
                <div class="welcome-message">
                    <h2>환영합니다!</h2>
                    <p>여러가지 레트로 게임을 즐겨보세요.</p>
                </div>
                <div class="game-list">
                    <div class="game-card">
                        <h2>팀 배정 게임</h2>
                        <p>파티장을 선택하고 팀을 만들어보세요!</p>
                        <a href="games/seatChange/index.html" class="play-button">게임 시작</a>
                    </div>
                    <div class="game-card">
                        <h2>게임 2</h2>
                        <p>곧 출시 예정!</p>
                    </div>
                    <div class="game-card">
                        <h2>게임 3</h2>
                        <p>곧 출시 예정!</p>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="games-content">
                <div class="game-list">
                    <div class="game-card">
                        <h2>게임 1</h2>
                        <p>곧 출시 예정!</p>
                    </div>
                    <div class="game-card">
                        <h2>게임 2</h2>
                        <p>곧 출시 예정!</p>
                    </div>
                    <div class="game-card">
                        <h2>게임 3</h2>
                        <p>곧 출시 예정!</p>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="about-content">
                <div class="about-content">
                    <h2>레트로 게임 월드</h2>
                    <p>여러가지 재미있는 게임들을 즐겨보세요!</p>
                    <p>곧 새로운 게임들이 추가될 예정입니다.</p>
                </div>
            </div>
        </main>

        <nav class="tab-menu">
            <button class="tab-button active" data-tab="home">🏠 홈</button>
            <button class="tab-button" data-tab="games">🎮 게임</button>
            <button class="tab-button" data-tab="about">ℹ️ 정보</button>
        </nav>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
